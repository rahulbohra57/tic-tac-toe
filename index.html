<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .scoreboard {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .score-card {
      text-align: center;
      background: #1a1a2e;
      border: 1px solid #2d2d4e;
      border-radius: 12px;
      padding: 0.6rem 1.4rem;
      min-width: 80px;
    }

    .score-card .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 0.2rem;
    }

    .score-card .value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .score-card.x-card .value { color: #a78bfa; }
    .score-card.o-card .value { color: #60a5fa; }
    .score-card.draw-card .value { color: #888; }

    .status {
      font-size: 1.1rem;
      margin-bottom: 1.4rem;
      height: 1.5rem;
      color: #ccc;
      transition: color 0.3s;
    }

    .status.winner { color: #fbbf24; font-weight: 600; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 10px;
    }

    .cell {
      background: #1a1a2e;
      border: 2px solid #2d2d4e;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, border-color 0.2s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #252540;
      border-color: #5b5b9e;
      transform: scale(1.04);
    }

    .cell.x { color: #a78bfa; }
    .cell.o { color: #60a5fa; }
    .cell.taken { cursor: default; }

    .cell.winning {
      background: #2a2040;
      border-color: #fbbf24;
      animation: pulse 0.6s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.6rem;
    }

    button {
      padding: 0.55rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    #restartBtn {
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      color: #0f0f1a;
    }

    #resetScoreBtn {
      background: #2d2d4e;
      color: #aaa;
    }

    .turn-indicator {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .turn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2d2d4e;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .turn-dot.active-x { background: #a78bfa; box-shadow: 0 0 8px #a78bfa; }
    .turn-dot.active-o { background: #60a5fa; box-shadow: 0 0 8px #60a5fa; }
  </style>
</head>
<body>

  <h1>TIC TAC TOE</h1>

  <div class="scoreboard">
    <div class="score-card x-card">
      <div class="label">X</div>
      <div class="value" id="scoreX">0</div>
    </div>
    <div class="score-card draw-card">
      <div class="label">Draw</div>
      <div class="value" id="scoreDraw">0</div>
    </div>
    <div class="score-card o-card">
      <div class="label">O</div>
      <div class="value" id="scoreO">0</div>
    </div>
  </div>

  <div class="turn-indicator">
    <div class="turn-dot active-x" id="dotX"></div>
    <div class="turn-dot" id="dotO"></div>
  </div>

  <div class="status" id="status">X's turn</div>

  <div class="board" id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <div class="controls">
    <button id="restartBtn">New Game</button>
    <button id="resetScoreBtn">Reset Score</button>
  </div>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    const cells = Array.from(document.querySelectorAll('.cell'));
    const statusEl = document.getElementById('status');
    const scoreX = document.getElementById('scoreX');
    const scoreO = document.getElementById('scoreO');
    const scoreDraw = document.getElementById('scoreDraw');
    const dotX = document.getElementById('dotX');
    const dotO = document.getElementById('dotO');

    let board, current, gameOver, scores;

    function init() {
      scores = { X: 0, O: 0, Draw: 0 };
      resetGame();
    }

    function resetGame() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      cells.forEach(c => {
        c.textContent = '';
        c.className = 'cell';
      });
      updateStatus();
      updateTurnDots();
    }

    function updateStatus(winner, isDraw) {
      if (winner) {
        statusEl.textContent = `${winner} wins!`;
        statusEl.className = 'status winner';
      } else if (isDraw) {
        statusEl.textContent = "It's a draw!";
        statusEl.className = 'status winner';
      } else {
        statusEl.textContent = `${current}'s turn`;
        statusEl.className = 'status';
      }
    }

    function updateTurnDots() {
      dotX.className = 'turn-dot' + (current === 'X' && !gameOver ? ' active-x' : '');
      dotO.className = 'turn-dot' + (current === 'O' && !gameOver ? ' active-o' : '');
    }

    function checkWinner() {
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], line: [a, b, c] };
        }
      }
      return null;
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const i = +cell.dataset.i;
        if (gameOver || board[i]) return;

        board[i] = current;
        cell.textContent = current;
        cell.classList.add('taken', current.toLowerCase());

        const result = checkWinner();
        if (result) {
          gameOver = true;
          result.line.forEach(idx => cells[idx].classList.add('winning'));
          scores[result.winner]++;
          scoreX.textContent = scores.X;
          scoreO.textContent = scores.O;
          updateStatus(result.winner);
          updateTurnDots();
        } else if (board.every(v => v)) {
          gameOver = true;
          scores.Draw++;
          scoreDraw.textContent = scores.Draw;
          updateStatus(null, true);
          updateTurnDots();
        } else {
          current = current === 'X' ? 'O' : 'X';
          updateStatus();
          updateTurnDots();
        }
      });
    });

    document.getElementById('restartBtn').addEventListener('click', resetGame);
    document.getElementById('resetScoreBtn').addEventListener('click', () => {
      scores = { X: 0, O: 0, Draw: 0 };
      scoreX.textContent = 0;
      scoreO.textContent = 0;
      scoreDraw.textContent = 0;
      resetGame();
    });

    init();
  </script>
</body>
</html>
